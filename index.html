<style>
:root{
  --bg:#0E0E10;
  --surface:#18181C;
  --surface-raised:#1E1E23;
  --line:#2B2B31;
  --ink:#F2EFE9;
  --ink-soft:#9C9A96;
  --gold:#D9A441;
  --gold-soft:rgba(217,164,65,0.14);
  --green:#4FAE78;
  --green-soft:rgba(79,174,120,0.14);
  --red:#D9584C;
  --red-soft:rgba(217,88,76,0.14);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -14px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
body{margin:0;}
::selection{background:var(--gold-soft);}
body, input, select, textarea, button{ font-family:'Inter',system-ui,sans-serif; color:var(--ink); }
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
body{background:var(--bg);min-height:100vh;}
button{cursor:pointer;font:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#333338;border-radius:8px;}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.sidebar{ background:#0A0A0B;color:#D8D5CE;padding:26px 16px; display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line); }
.brand{ display:flex;align-items:center;gap:10px;padding:0 10px 22px 10px; }
.brand-mark{width:30px;height:30px;flex:none;}
.brand-text{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#fff;letter-spacing:.2px;line-height:1.15;}
.brand-text small{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;}
.nav-item{ display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px; font-size:14px;font-weight:500;color:#9C978A;background:transparent;border:none; text-align:left;transition:background .15s,color .15s;width:100%; }
.nav-item svg{flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--gold-soft);color:var(--gold);}
.nav-label-short{display:none;}
.nav-subitem{padding-left:34px;}
.nav-caret{margin-left:auto;font-size:11px;opacity:.7;}
.nav-subgroup{display:flex;flex-direction:column;gap:2px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;}
.user-chip:hover{background:rgba(255,255,255,0.05);}
.user-avatar{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#111;font-weight:700;font-size:13px;font-family:'Fraunces',serif;overflow:hidden;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-meta{flex:1;min-width:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:11px;color:#8B8780;}
.logout-btn{background:none;border:none;color:#8B8780;padding:4px;border-radius:6px;flex:none;display:inline-flex;align-items:center;justify-content:center;}
.logout-btn:hover{color:#fff;background:rgba(255,255,255,0.08);}
.local-note{font-size:11px;color:#6E6B64;margin-top:10px;display:flex;align-items:center;gap:6px;}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}

.main{padding:32px 38px 90px;max-width:1180px;min-width:0;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.page-head h1{font-size:25px;font-weight:600;margin:0 0 4px;color:#fff;}
.page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.btn{ display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px; border:1px solid var(--line);background:var(--surface-raised);font-size:13.5px;font-weight:600;color:var(--ink); box-shadow:var(--shadow);white-space:nowrap; }
.btn:hover{border-color:#3A3A41;}
.btn.primary{background:var(--gold);color:#1A1305;border-color:var(--gold);}
.btn.primary:hover{background:#E5B457;}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-soft);}
.btn.danger{color:var(--red);}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);}
.card h3{margin:0 0 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
.card .big{font-size:24px;font-weight:600;margin-top:6px;color:#fff;}
.card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.card.alert{border-color:rgba(217,88,76,0.4);background:linear-gradient(180deg, rgba(217,88,76,0.08), var(--surface));}

.section-title{font-size:15.5px;font-weight:600;margin:30px 0 12px;display:flex;align-items:center;gap:10px;color:#fff;}
.section-title .count{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--line);padding:2px 8px;border-radius:20px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:0 12px 10px;font-weight:600;}
td{padding:12px;border-top:1px solid var(--line);}
tr:hover td{background:rgba(255,255,255,0.02);}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);overflow-x:auto;}
.table-wrap table{padding:6px;min-width:560px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.tag-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.amount-pos{color:var(--green);font-weight:600;}
.amount-neg{color:var(--red);font-weight:600;}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .display{font-size:18px;color:#fff;margin-bottom:6px;}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px;}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-soft);}
.chip.active{background:var(--gold);color:#1A1305;border-color:var(--gold);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:50;}
.overlay.show{display:flex;}
.modal{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;width:100%;max-width:480px;box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);}
.modal h2{margin:0 0 16px;font-size:18px;color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{ width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line); background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit; }
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent;}
.field input:disabled{opacity:.6;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.opcionais-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
.opcional-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--line);cursor:pointer;transition:background .15s,border-color .15s,color .15s;font-size:13.5px;font-weight:400;color:var(--ink-soft);}
.opcional-chip:hover{border-color:rgba(217,164,65,0.5);}
.opcional-chip.checked{background:var(--gold-soft);border-color:var(--gold);color:#fff;}
.opcional-chip input[type=checkbox]{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:6px;border:2px solid var(--line);flex:none;cursor:pointer;position:relative;transition:background .15s,border-color .15s;margin:0;}
.opcional-chip.checked input[type=checkbox]{background:var(--gold);border-color:var(--gold);}
.opcional-chip.checked input[type=checkbox]::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#1c1c1e;font-size:12px;font-weight:700;}
.opcionais-tags{display:flex;flex-wrap:wrap;gap:6px;}
.opcionais-tags .pill{background:rgba(255,255,255,0.06);color:var(--ink-soft);font-size:12px;}
.veiculos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:8px;}
.veiculo-card-mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color .15s;}
.veiculo-card-mini:hover{border-color:var(--gold);}
.veiculo-card-mini-photo{width:100%;aspect-ratio:4/3;background:#1c1c1e;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.veiculo-card-mini-photo img{width:100%;height:100%;object-fit:cover;}
.veiculo-card-mini-info{padding:8px 10px;}
.veiculo-card-mini-info b{display:block;font-size:13px;color:#fff;font-weight:600;}
.swatch.sel{border-color:#fff;}
.error-msg{color:var(--red);font-size:13px;margin-top:8px;}

.tab-toggle{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:11px;width:max-content;margin-bottom:6px;}
.tab-toggle button{padding:8px 16px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}
.tab-toggle button.active{background:var(--gold);color:#1A1305;}

.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-raised);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}

.hidden{display:none !important;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%, #1a1a1e, #0E0E10 60%);}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:30px;box-shadow:var(--shadow);}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px;}
.login-brand .brand-mark{width:56px;height:56px;margin-bottom:12px;}
.login-brand h1{font-size:21px;margin:0;color:#fff;}
.login-brand p{color:var(--ink-soft);font-size:13px;margin:4px 0 0;}
.who-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.who-btn{ display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px; border-radius:14px;border:1px solid var(--line);background:var(--bg); }
.who-btn:hover{border-color:var(--gold);}
.who-btn.sel{border-color:var(--gold);background:var(--gold-soft);}
.who-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111;font-weight:700;font-family:'Fraunces',serif;font-size:17px;overflow:hidden;}
.who-avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-upload-preview{width:72px;height:72px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#111;font-weight:700;font-family:'Fraunces',serif;font-size:26px;margin:0 auto 12px;}
.avatar-upload-preview img{width:100%;height:100%;object-fit:cover;}
.who-name{font-size:12px;font-weight:600;text-align:center;line-height:1.2;color:var(--ink);}
.login-back{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-bottom:10px;padding:0;}

.mobile-topbar,.mobile-nav,.mobile-drawer,.mobile-drawer-backdrop,.hamburger-btn{display:none;}
@media(max-width:820px){
  html,body{overflow-x:hidden;}
  .app{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:70px 16px 32px;max-width:100%;overflow-x:hidden;}
  .mobile-topbar{ display:flex;align-items:center;justify-content:space-between;gap:10px; position:fixed;top:0;left:0;right:0;height:56px;padding:0 10px; background:#0A0A0B;color:#fff;z-index:65;border-bottom:1px solid var(--line); }
  .mobile-topbar .brand{padding:0;}
  .mobile-topbar .brand-mark{width:24px;height:24px;}
  .mobile-topbar .brand-text{font-size:15px;}
  .hamburger-btn{ display:flex;align-items:center;justify-content:center; width:40px;height:40px;background:none;border:none;color:#fff;font-size:22px;border-radius:8px; }
  .mobile-drawer-backdrop{ display:block;position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:55; opacity:0;pointer-events:none;transition:opacity .2s ease; }
  .mobile-drawer-backdrop.show{opacity:1;pointer-events:auto;}
  .mobile-drawer{ display:flex;flex-direction:column;gap:5px; position:fixed;top:56px;left:0;bottom:0;width:82%;max-width:300px; background:#0A0A0B;color:#D8D5CE;padding:24px 16px;z-index:60; transform:translateX(-105%);transition:transform .25s ease;overflow-y:auto;border-right:1px solid var(--line); }
  .mobile-drawer.open{transform:translateX(0);}
  .g4,.g3,.g2{grid-template-columns:1fr;}
  .page-head{align-items:flex-start;}
  .field-row{grid-template-columns:1fr;}
  .who-grid{grid-template-columns:repeat(2,1fr);}
  .table-wrap{overflow-x:hidden;}
  .table-wrap table{min-width:0;width:100%;}
  .resp-table thead{display:none;}
  .resp-table, .resp-table tbody, .resp-table tr, .resp-table td{display:block;width:100%;}
  .resp-table tr{padding:10px 4px;border-top:1px solid var(--line);}
  .resp-table tr:first-child{border-top:none;}
  .resp-table td{border:none;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;}
  .resp-table td[data-label]::before{content:attr(data-label);font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;text-align:left;}
  .resp-table td:empty{display:none;}
}
</style>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  createUserWithEmailAndPassword, updatePassword, EmailAuthProvider, reauthenticateWithCredential
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ============================================================
   FIREBASE — SUBSTITUA pelo config do SEU projeto Firebase
   (Console Firebase > Configurações do projeto > Seus apps > SDK)
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyD_TVxp65Y5ClDA0xwYXJoi7M_5kcQ8b5c",
  authDomain: "moreira-motors-a845c.firebaseapp.com",
  projectId: "moreira-motors-a845c",
  storageBucket: "moreira-motors-a845c.firebasestorage.app",
  messagingSenderId: "959463517027",
  appId: "1:959463517027:web:407a5d995368315a494156"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const secondaryApp = initializeApp(firebaseConfig, "secondary");
const secondaryAuth = getAuth(secondaryApp);

function traduzErroFirebase(err){
  const map = {
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Conta não encontrada.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.',
    'auth/email-already-in-use':'Esse nome de usuário já existe. Escolha outro.',
    'auth/weak-password':'Senha muito curta (mínimo 6 caracteres).',
    'auth/invalid-email':'Nome de usuário inválido.',
    'auth/requires-recent-login':'Por segurança, saia e entre de novo antes de trocar a senha.',
    'auth/network-request-failed':'Falha de conexão. Verifique sua internet.',
    'permission-denied':'Sem permissão para fazer isso.'
  };
  return map[err.code] || err.message || 'Ocorreu um erro. Tente de novo.';
}

/* ============================================================
   ESTADO / HELPERS DE DATA
============================================================ */
const pad2 = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00')) / 86400000);

const PALETTE = ['#D9A441','#4FAE78','#5B8FD9','#D9584C','#B98CD9','#4CB8B0','#D9A441'];
const APP_VERSION = '2026-09-05.1';

let DATA = { users: [], vehicles: [], expenses: [], capitalEntries: [] };
let currentUser = null;
let usersLoaded = false;
let pendingUid;
let loginError = '';
let protectedUnsubs = [];

function subscribeProtected(){
  protectedUnsubs.push(onSnapshot(collection(db,'vehicles'), snap=>{
    DATA.vehicles = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
  }, err=>console.error('vehicles:', err)));
  protectedUnsubs.push(onSnapshot(collection(db,'expenses'), snap=>{
    DATA.expenses = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
  }, err=>console.error('expenses:', err)));
  protectedUnsubs.push(onSnapshot(collection(db,'capitalEntries'), snap=>{
    DATA.capitalEntries = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
  }, err=>console.error('capitalEntries:', err)));
}
function unsubscribeProtected(){
  protectedUnsubs.forEach(u=>u()); protectedUnsubs = [];
  DATA.vehicles = []; DATA.expenses = []; DATA.capitalEntries = [];
}

function tryResolveSession(){
  if(pendingUid === undefined) return;
  if(pendingUid === null){
    if(currentUser){ unsubscribeProtected(); currentUser = null; }
    render(); return;
  }
  if(!usersLoaded) return;
  const match = DATA.users.find(u=>u.id===pendingUid);
  if(match){
    const wasLoggedIn = !!currentUser;
    currentUser = match;
    if(!wasLoggedIn){ subscribeProtected(); currentTab = 'dashboard'; }
    render();
  } else {
    loginError = 'Essa conta ainda não tem acesso a este sistema. Peça para o administrador te cadastrar em "Usuários".';
    signOut(auth);
  }
}

onSnapshot(collection(db,'users'), snap=>{
  DATA.users = snap.docs.map(d=>({id:d.id, ...d.data()}));
  usersLoaded = true; tryResolveSession();
}, err=>{ console.error('users:', err); usersLoaded = true; render(); });

onAuthStateChanged(auth, fbUser=>{ pendingUid = fbUser ? fbUser.uid : null; tryResolveSession(); });

/* ============================================================
   HELPERS FINANCEIROS
============================================================ */
const fmt = (v) => (v<0?'-':'') + 'R$ ' + Math.abs(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function parseMoney(str){
  if(typeof str !== 'string') return parseFloat(str) || 0;
  let s = str.trim();
  if(s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',', '.');
  else if(s.includes(',')) s = s.replace(',', '.');
  return parseFloat(s) || 0;
}

/* ============================================================
   TABELA FIPE (marca/modelo/ano corretos e valor de referência)
   API pública gratuita: https://fipe.parallelum.com.br (dados oficiais FIPE)
============================================================ */
const FIPE_BASE = 'https://fipe.parallelum.com.br/api/v2';
const CORES_VEICULO = ['Branco','Prata','Preto','Cinza','Vermelho','Azul','Verde','Amarelo','Marrom','Bege','Dourado','Vinho','Laranja','Roxo'];
const CORES_HEX = { Branco:'#F2F1EC', Prata:'#B7BCC2', Preto:'#1C1C1E', Cinza:'#8A8F97', Vermelho:'#C0392B', Azul:'#2B6CC4', Verde:'#2F8F4E', Amarelo:'#E8C547', Marrom:'#6B4423', Bege:'#D8C4A0', Dourado:'#C9A227', Vinho:'#6B1F2A', Laranja:'#D9772F', Roxo:'#6B3FA0' };
function corVeiculoHex(cor){ return CORES_HEX[cor] || '#8A8F97'; }
const OPCIONAIS_CARRO = ['Ar-condicionado','Direção hidráulica/elétrica','Vidro elétrico','Trava elétrica','Airbag','Freio ABS','Rodas de liga leve','Central multimídia','Câmera de ré','Sensor de estacionamento','Bancos de couro','Teto solar','Piloto automático','Kit gás (GNV)'];
const OPCIONAIS_MOTO = ['Freio ABS','Partida elétrica','Painel digital','Injeção eletrônica','Alarme','Baú/bagageiro','Protetor de motor','Guidão esportivo','Freio CBS','Pneu novo'];
function opcionaisPadrao(tipo){ return tipo==='moto' ? OPCIONAIS_MOTO : OPCIONAIS_CARRO; }
// Renderiza a lista de opcionais como "chips" com checkbox estilizado, e liga o toggle visual.
function renderOpcionaisChips(container, lista, selecionados){
  container.innerHTML = lista.map(op=>`<label class="opcional-chip ${selecionados.has(op)?'checked':''}"><input type="checkbox" value="${op}" ${selecionados.has(op)?'checked':''}><span>${op}</span></label>`).join('');
  container.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=> cb.closest('.opcional-chip').classList.toggle('checked', cb.checked));
  });
}
function fipeTipoPath(tipo){ return tipo==='moto' ? 'motorcycles' : 'cars'; }
async function fipeGetJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('FIPE respondeu '+res.status);
  return res.json();
}
function fipeBrands(tipo){ return fipeGetJson(`${FIPE_BASE}/${fipeTipoPath(tipo)}/brands`); }
function fipeModels(tipo, brandCode){ return fipeGetJson(`${FIPE_BASE}/${fipeTipoPath(tipo)}/brands/${brandCode}/models`); }
function fipeYears(tipo, brandCode, modelCode){ return fipeGetJson(`${FIPE_BASE}/${fipeTipoPath(tipo)}/brands/${brandCode}/models/${modelCode}/years`); }
function fipeValue(tipo, brandCode, modelCode, yearCode){ return fipeGetJson(`${FIPE_BASE}/${fipeTipoPath(tipo)}/brands/${brandCode}/models/${modelCode}/years/${yearCode}`); }
function parseFipePrice(str){ return parseFloat(String(str).replace('R$','').trim().replace(/\./g,'').replace(',','.')) || 0; }
/* A FIPE não separa "modelo" de "versão" — cada item já vem com o nome completo
   (ex: "Astra Sedan Advantage 2.0 8V Flex 4p Aut."). Pra oferecer os dois campos
   separados sem inventar dados, agrupamos os itens pelo nome-base (ex: "Astra")
   e a lista de "versões" mostra as opções completas dentro daquele grupo — os
   códigos/anos/valores usados continuam vindo 100% da API, isso é só uma
   organização visual da mesma lista oficial. */
const FIPE_PREFIXOS_COMPOSTOS = ['grand','new','novo','cross','space','range','land','todo','power','super','city','del','punto'];
function fipeExtrairModeloBase(nomeCompleto){
  const partes = String(nomeCompleto).trim().split(/\s+/);
  if(partes.length<=1) return partes[0]||nomeCompleto;
  if(FIPE_PREFIXOS_COMPOSTOS.includes(partes[0].toLowerCase())) return partes[0]+' '+partes[1];
  return partes[0];
}
function fipeAgruparModelos(models){
  const grupos = new Map();
  models.forEach(m=>{
    const base = fipeExtrairModeloBase(m.name);
    if(!grupos.has(base)) grupos.set(base, []);
    grupos.get(base).push(m);
  });
  return grupos;
}
const userById = id => DATA.users.find(u=>u.id===id);
const vehicleById = id => DATA.vehicles.find(v=>v.id===id);
function initialOf(name){ return (name||'?').trim()[0]?.toUpperCase() || '?'; }
function avatarContent(user){ return user && user.photoDataUrl ? `<img src="${user.photoDataUrl}" alt="">` : initialOf(user && user.name); }

// Miniatura do veículo removida a pedido do Maycon (nenhuma tentativa ficou boa) — sem ícone
// por enquanto. Quando ele trouxer uma arte pronta (por fora do sistema), a gente reintroduz aqui.
// Nome curto pra caixinhas pequenas (cards do Painel): só marca + primeira palavra do modelo,
// nunca a versão — evita texto grande estourando o card.
function nomeCurtoVeiculo(vehicle){
  const marca = (vehicle.marca||'').trim();
  const modelo = (vehicle.modelo||'').trim().split(/\s+/)[0] || '';
  return `${marca} ${modelo}`.trim();
}
// 'admin' e 'socioadmin' têm permissão total no sistema. Só 'socioadmin' e 'socio' (legado) entram na divisão de lucro.
// 'gerente' e 'vendedor' são só operacionais: usam o sistema, mas não têm permissão de admin nem entram no rateio de lucro.
// Atenção: o primeiro usuário admin (criado manualmente no Firestore) tem role 'admin' — se ele também for sócio,
// troque o campo role dele para 'socioadmin' direto no Firestore Console pra entrar na divisão de lucro.
function isAdminRole(role){ return role==='admin' || role==='socioadmin'; }
function isPartnerRole(role){ return role==='socioadmin' || role==='socio'; }
function isAdmin(){ return !!currentUser && isAdminRole(currentUser.role); }
function requireAdmin(){ if(!isAdmin()){ alert('Apenas o administrador pode fazer isso.'); return false; } return true; }
function isSocioAdmin(){ return !!currentUser && currentUser.role==='socioadmin'; }
function roleLabel(role){
  return { admin:'Administrador(a)', socioadmin:'Sócio-admin', socio:'Sócio(a)', gerente:'Gerente', vendedor:'Vendedor(a)' }[role] || role || '—';
}

function expensesOf(vehicleId){ return DATA.expenses.filter(e=>e.vehicleId===vehicleId); }
function expensesTotalOf(vehicleId){ return expensesOf(vehicleId).reduce((s,e)=>s+e.valor,0); }

// Lucro bruto de um veículo vendido: venda - compra (próprio) ou comissão (consignação) — antes de despesas
function lucroBrutoVeiculo(v){
  if(v.status!=='vendido') return 0;
  if(v.categoria==='consignacao') return (v.valorComissao||0);
  return (v.valorVenda||0) - (v.valorCompra||0);
}
// Lucro líquido (após despesas compartilhadas) de um veículo vendido
function lucroLiquidoCompartilhadoVeiculo(v){
  const desp = expensesOf(v.id).filter(e=>e.divisao==='dividir').reduce((s,e)=>s+e.valor,0);
  return lucroBrutoVeiculo(v) - desp;
}
function despesasIndividuaisDoSocio(v, userId){
  return expensesOf(v.id).filter(e=>e.divisao==='individual' && e.socioId===userId).reduce((s,e)=>s+e.valor,0);
}
// Percentual de divisão de lucro do veículo para um sócio (default: dividido igualmente entre todos os sócios)
function pctSocioNoVeiculo(v, userId){
  if(v.divisaoLucro && typeof v.divisaoLucro[userId]==='number') return v.divisaoLucro[userId];
  const socios = DATA.users.filter(u=>isPartnerRole(u.role));
  return socios.length ? (100/socios.length) : 0;
}
function lucroAcumuladoDoSocio(userId){
  let total = 0;
  DATA.vehicles.filter(v=>v.status==='vendido').forEach(v=>{
    const liquido = lucroLiquidoCompartilhadoVeiculo(v);
    const parte = liquido * (pctSocioNoVeiculo(v,userId)/100);
    total += parte - despesasIndividuaisDoSocio(v,userId);
  });
  return total;
}
function capitalAportadoDoSocio(userId){
  return DATA.capitalEntries.filter(c=>c.userId===userId).reduce((s,c)=> s + (c.tipo==='retirada'? -c.valor : c.valor), 0);
}
// Gastos gerais da empresa: despesas sem vínculo com nenhum veículo (produtos de limpeza, guias de imposto, etc.)
// — não entram no lucro de veículo nenhum, mas são descontados do capital de cada sócio.
function despesasGerais(){ return DATA.expenses.filter(e=>!e.vehicleId); }
function pctSocioIgual(){
  const socios = DATA.users.filter(u=>isPartnerRole(u.role));
  return socios.length ? (100/socios.length) : 0;
}
function despesaGeralDoSocio(userId){
  return despesasGerais().reduce((s,e)=>{
    if(e.divisao==='individual') return s + (e.socioId===userId ? e.valor : 0);
    return s + e.valor * (pctSocioIgual()/100);
  }, 0);
}
// Capital do sócio = aporte + lucro acumulado nos veículos vendidos − parte dele nos gastos gerais da empresa
function capitalSocioDoSocio(userId){
  return capitalAportadoDoSocio(userId) + lucroAcumuladoDoSocio(userId) - despesaGeralDoSocio(userId);
}
function lucroTotalRealizado(){
  return DATA.vehicles.filter(v=>v.status==='vendido').reduce((s,v)=>s+lucroLiquidoCompartilhadoVeiculo(v),0);
}
// Caixa atual = tudo que entrou (aportes + vendas/comissões) - tudo que saiu (compras de veículo próprio + despesas)
function caixaAtual(){
  const aportes = DATA.capitalEntries.reduce((s,c)=> s + (c.tipo==='retirada'? -c.valor : c.valor), 0);
  const receitasVendas = DATA.vehicles.filter(v=>v.status==='vendido').reduce((s,v)=> s + lucroBrutoVeiculo(v) + (v.categoria!=='consignacao'? v.valorCompra||0 : 0), 0);
  // receitasVendas acima = (venda - compra) + compra = venda, para próprio; = comissão, para consignação. Simplifica pra: valor recebido de fato.
  const comprasVeiculos = DATA.vehicles.filter(v=>v.categoria!=='consignacao').reduce((s,v)=>s+(v.valorCompra||0),0);
  const despesasTotais = DATA.expenses.reduce((s,e)=>s+e.valor,0);
  return aportes + receitasVendas - comprasVeiculos - despesasTotais;
}
function diasEmEstoque(v){
  const fim = v.status==='vendido' ? v.dataVenda : todayStr();
  if(!v.dataEntrada || !fim) return null;
  return daysBetween(v.dataEntrada, fim);
}

function brandMark(size){
  const s = size||30;
  return `<img class="brand-mark" src="${LOGO_DATA_URI}" width="${s}" height="${s}" style="border-radius:${Math.round(s*0.22)}px;object-fit:cover;" alt="Moreira Motors">`;
}

const NAV_ITEMS = [
  {tab:'dashboard', label:'Painel', short:'Painel', icon:'📊'},
  {tab:'despesas', label:'Caixa diário', short:'Gastos', icon:'🧾'},
  {tab:'estoque', label:'Estoque', short:'Estoque', icon:'🚗'},
  {tab:'caixa', label:'Carteiras', short:'Carteiras', icon:'💰'}
];
const NAV_CONFIG_GROUP = {
  label:'Configurações', short:'Config.', icon:'⚙️',
  children:[
    {tab:'socios', label:'Usuários', short:'Usuários', icon:'🤝'},
    {tab:'backup', label:'Backup', short:'Backup', icon:'☁️'}
  ]
};
function buildNavHtml(){
  const itemsHtml = NAV_ITEMS.map(n=>`<button class="nav-item ${currentTab===n.tab?'active':''}" data-tab="${n.tab}"><span class="nav-icon">${n.icon}</span><span class="nav-label-full">${n.label}</span><span class="nav-label-short">${n.short}</span></button>`).join('');
  const configActive = NAV_CONFIG_GROUP.children.some(c=>c.tab===currentTab);
  const open = configMenuOpen || configActive;
  const childrenHtml = NAV_CONFIG_GROUP.children.map(c=>`<button class="nav-item nav-subitem ${currentTab===c.tab?'active':''}" data-tab="${c.tab}"><span class="nav-icon">${c.icon}</span><span class="nav-label-full">${c.label}</span><span class="nav-label-short">${c.short}</span></button>`).join('');
  const groupHtml = `
    <button class="nav-item nav-group-toggle ${configActive?'active':''}" type="button">
      <span class="nav-icon">${NAV_CONFIG_GROUP.icon}</span><span class="nav-label-full">${NAV_CONFIG_GROUP.label}</span><span class="nav-label-short">${NAV_CONFIG_GROUP.short}</span>
      <span class="nav-caret">${open?'▾':'▸'}</span>
    </button>
    <div class="nav-subgroup" style="${open?'':'display:none;'}">${childrenHtml}</div>`;
  return itemsHtml + groupHtml;
}

   MODAL
============================================================ */
const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modal-content');
function openModal(html){ modalContent.innerHTML = html; overlay.classList.add('show'); }
function closeModal(){ overlay.classList.remove('show'); modalContent.innerHTML=''; }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

   RENDER ROOT
============================================================ */
function render(){
  const root = document.getElementById('root');

  if(pendingUid === undefined || (pendingUid && !currentUser && !loginError)){
    root.innerHTML = `<div class="login-wrap"><div class="login-card" style="text-align:center;">
      ${brandMark(44)}<p class="sub" style="margin-top:10px;color:var(--ink-soft);">Carregando…</p>
    </div></div>`;
    return;
  }
  if(!currentUser){ root.innerHTML = renderLogin(); attachLoginHandlers(); return; }

  document.body.style.overflow = mobileDrawerOpen ? 'hidden' : '';
  const navHtml = buildNavHtml();
  root.innerHTML = `
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menu">☰</button>
      <div class="brand">${brandMark(22)}<span class="brand-text">Moreira Motors</span></div>
      <button class="logout-btn" id="mobile-profile-btn">${editIcon}</button>
    </div>
    <div class="mobile-drawer-backdrop ${mobileDrawerOpen?'show':''}" id="drawer-backdrop"></div>
    <div class="mobile-drawer ${mobileDrawerOpen?'open':''}">
      ${navHtml}
      <div class="sidebar-foot">
        <div class="user-chip" id="mobile-drawer-profile-btn" style="cursor:pointer;">
          <div class="user-avatar" style="background:${currentUser.color}">${avatarContent(currentUser)}</div>
          <div class="user-meta"><div class="user-name">${currentUser.name}</div><div class="user-role">${roleLabel(currentUser.role)}</div></div>
        </div>
        <button class="btn ghost drawer-logout-btn" style="width:100%;justify-content:center;margin-top:12px;color:#D8D5CE;border:1px solid rgba(255,255,255,.15);">${logoutIcon}&nbsp; Sair</button>
        <div class="local-note"><span class="sync-dot"></span>Sincronizado em tempo real</div>
      </div>
    </div>
    <div class="app">
      <nav class="sidebar">
        <div class="brand">${brandMark(30)}<span class="brand-text">Moreira<br><small>Motors · Sistema</small></span></div>
        ${navHtml}
        <div class="sidebar-foot">
          <div class="user-chip" id="profile-btn" style="cursor:pointer;">
            <div class="user-avatar" style="background:${currentUser.color}">${avatarContent(currentUser)}</div>
            <div class="user-meta"><div class="user-name">${currentUser.name}</div><div class="user-role">${roleLabel(currentUser.role)}</div></div>
            <button class="logout-btn" id="logout-btn" title="Sair">${logoutIcon}</button>
          </div>
          <div class="local-note"><span class="sync-dot"></span>Sincronizado em tempo real</div>
        </div>
      </nav>
      <main class="main" id="main"></main>
    </div>
  `;
  const main = document.getElementById('main');
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='estoque') main.innerHTML = renderEstoque();
  else if(currentTab==='caixa') main.innerHTML = renderCaixa();
  else if(currentTab==='despesas') main.innerHTML = renderDespesas();
  else if(currentTab==='socios') main.innerHTML = renderSocios();
  else if(currentTab==='backup') main.innerHTML = renderBackup();
  attachHandlers();
}

function renderLogin(){
  if(!loginSelectedUser){
    const cards = DATA.users.map(u=>`
      <button class="who-btn" data-uid="${u.id}">
        <div class="who-avatar" style="background:${u.color}">${avatarContent(u)}</div>
        <div class="who-name">${u.name}</div>
      </button>`).join('');
    return `
    <div class="login-wrap"><div class="login-card">
      <div class="login-brand">${brandMark(56)}<h1>Moreira Motors</h1><p>Quem é você?</p></div>
      ${loginError? `<div class="error-msg" style="text-align:center;margin-bottom:14px;">${loginError}</div>` : ''}
      ${DATA.users.length ? `<div class="who-grid">${cards}</div>` : `<div class="empty-state" style="padding:20px 0;">Nenhum sócio cadastrado ainda. Veja o rodapé do arquivo para criar o primeiro acesso admin.</div>`}
    </div></div>`;
  }
  const u = userById(loginSelectedUser);
  return `
  <div class="login-wrap"><div class="login-card">
    <button class="login-back" id="login-back">← Voltar</button>
    <div class="login-brand">
      <div class="who-avatar" style="background:${u.color};width:56px;height:56px;font-size:20px;margin:0 auto 10px;">${avatarContent(u)}</div>
      <h1 style="font-size:18px;">${u.name}</h1><p>Digite sua senha</p>
    </div>
    <form id="login-form">
      <div class="field"><input name="password" type="password" placeholder="Senha" autofocus required></div>
      <button type="submit" class="btn primary" style="width:100%;justify-content:center;">Entrar</button>
      <div class="error-msg hidden" id="login-error"></div>
    </form>
  </div></div>`;
}
function attachLoginHandlers(){
  document.querySelectorAll('.who-btn').forEach(b=>{ b.onclick = ()=>{ loginSelectedUser = b.dataset.uid; loginError=''; render(); }; });
  const back = document.getElementById('login-back');
  if(back) back.onclick = ()=>{ loginSelectedUser=null; render(); };
  const form = document.getElementById('login-form');
  if(form) form.onsubmit = async e=>{
    e.preventDefault();
    const pass = new FormData(e.target).get('password');
    const u = userById(loginSelectedUser);
    const errEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    try{ await signInWithEmailAndPassword(auth, u.email, pass); loginSelectedUser = null; }
    catch(err){ errEl.textContent = traduzErroFirebase(err); errEl.classList.remove('hidden'); btn.disabled = false; }
  };
}
function doLogout(){ signOut(auth); }

  const emEstoque = DATA.vehicles.filter(v=>v.status!=='vendido');
  const parados = emEstoque.map(v=>({v, dias:diasEmEstoque(v)})).filter(x=>x.dias!==null && x.dias>=60).sort((a,b)=>b.dias-a.dias);

  const paradosHtml = parados.length ? parados.map(({v,dias})=>`
    <tr>

    <div class="veiculo-card-mini" data-id="${v.id}">

    </div>`).join('') : `<div class="empty-state">Nenhum veículo em estoque no momento.</div>`;

  const ultimosVendidos = DATA.vehicles.filter(v=>v.status==='vendido').slice().sort((a,b)=>(b.dataVenda||'').localeCompare(a.dataVenda||'')).slice(0,5);
  const ultimosVendidosHtml = ultimosVendidos.length ? ultimosVendidos.map(v=>`
    <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);">
      <div style="flex:1;min-width:0;padding-left:4px;">
        <b style="color:#fff;font-size:13.5px;display:block;">${nomeCurtoVeiculo(v)}</b>
        <span class="sub" style="display:block;">${v.dataVenda? new Date(v.dataVenda+'T00:00').toLocaleDateString('pt-BR') : '—'}</span>

  <div class="page-head">
    <div><h1>Painel</h1><p>Olá, ${currentUser.name.split(' ')[0]} — visão geral da Moreira Motors</p></div>
  </div>
  <div class="grid g3">
    ${verFinanceiro? `<div class="card"><h3>Caixa atual</h3><div class="big num" style="color:${caixa>=0?'var(--green)':'var(--red)'}">${fmt(caixa)}</div><div class="sub">Dinheiro líquido disponível hoje</div></div>` : ''}
    ${verFinanceiro? `<div class="card"><h3>Lucro total realizado</h3><div class="big num" style="color:var(--green)">${fmt(lucro)}</div><div class="sub">Soma do lucro de todos os veículos vendidos</div></div>` : ''}
    <div class="card"><h3>Veículos em estoque</h3><div class="big num">${emEstoque.length}</div><div class="sub">${DATA.vehicles.filter(v=>v.status==='vendido').length} já vendido(s) ao todo</div></div>

  ${parados.length ? `

function statusLabel(s){ return {disponivel:'Disponível', manutencao:'Manutenção', vendido:'Vendido'}[s] || s; }
function statusColor(s){ return {disponivel:'var(--green)', manutencao:'var(--gold)', vendido:'var(--ink-soft)'}[s] || 'var(--ink-soft)'; }

function renderEstoque(){
  const filtros = [
    {v:'todos', label:'Todos'}, {v:'disponivel', label:'Disponível'},
    {v:'manutencao', label:'Manutenção'}, {v:'vendido', label:'Vendido'}
  ];
  let list = DATA.vehicles.slice().sort((a,b)=> (b.dataEntrada||'').localeCompare(a.dataEntrada||''));
  if(estoqueFiltro!=='todos') list = list.filter(v=>v.status===estoqueFiltro);

  const rows = list.map(v=>{
    const dias = diasEmEstoque(v);
    const desp = expensesTotalOf(v.id);
    const lucro = v.status==='vendido' ? lucroLiquidoCompartilhadoVeiculo(v) : null;
    return `<tr data-id="${v.id}">
      <td data-label="Veículo"><div style="padding-left:6px;"><b>${v.marca||''} ${v.modelo||''}</b><br><span class="sub">${v.anoModelo? v.anoModelo+' · ':''}${v.cor||''} ${v.tipo? '· '+v.tipo:''}</span></div></td>
      <td data-label="Categoria">${v.categoria==='consignacao'? `<span class="pill" style="background:var(--gold-soft);color:var(--gold)">Consignação${v.donoConsignacao? ' · '+v.donoConsignacao:''}</span>` : `<span class="pill" style="background:rgba(255,255,255,0.06);color:var(--ink-soft)">Próprio</span>`}</td>
      <td data-label="Status"><span class="pill" style="background:rgba(255,255,255,0.06);color:${statusColor(v.status)}">${statusLabel(v.status)}</span></td>
      <td data-label="Dias em estoque" class="num" style="${dias!==null && v.status!=='vendido' && dias>=60?'color:var(--red);font-weight:600;':''}">${dias===null?'—':dias+'d'}</td>
      <td data-label="Despesas" class="num">${fmt(desp)}</td>
      <td data-label="Lucro" class="num ${lucro!==null? (lucro>=0?'amount-pos':'amount-neg') : ''}">${lucro!==null? fmt(lucro) : '—'}</td>
      <td><div class="row-actions">
        <button class="icon-btn ver-veiculo" data-id="${v.id}" title="Ver / despesas">${editIcon}</button>
        <button class="icon-btn incrementar-veiculo" data-id="${v.id}" title="Incrementar (foto/opcionais)">${plusIcon}</button>
        ${isAdmin()? `<button class="icon-btn del-veiculo" data-id="${v.id}" title="Excluir">${trashIcon}</button>` : ''}
      </div></td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div><h1>Estoque</h1><p>Veículos próprios e em consignação</p></div>
    <button class="btn primary" id="new-veiculo">+ Novo veículo</button>
  </div>
  <div class="chips">${filtros.map(f=>`<button class="chip ${estoqueFiltro===f.v?'active':''}" data-filtro="${f.v}">${f.label}</button>`).join('')}</div>
  <div class="table-wrap">
    ${list.length ? `<table class="resp-table"><thead><tr><th>Veículo</th><th>Categoria</th><th>Status</th><th>Dias</th><th>Despesas</th><th>Lucro</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty-state">Nenhum veículo aqui ainda.</div>`}
  </div>
  `;
}

        </div>

      <div class="field" id="campo-dono-consignacao" style="${vehicle.categoria==='consignacao'?'':'display:none;'}">
        <label>Dono do veículo (consignação)</label><input name="donoConsignacao" value="${vehicle.donoConsignacao||''}">

      </div>

        <button type="button" class="btn ghost" id="cancel-modal">Cancelar</button>

  document.getElementById('cancel-modal').onclick = closeModal;

  const catSel = document.getElementById('veiculo-categoria');

    document.getElementById('campo-dono-consignacao').style.display = cons? '':'none';
    document.getElementById('campo-valor-compra').style.display = cons? 'none':'';
    document.getElementById('campo-comissao').style.display = cons? '':'none';
  };
  const statusSel = document.querySelector('select[name=status]');
  statusSel.onchange = ()=>{ document.getElementById('campos-venda').style.display = statusSel.value==='vendido' ? '' : 'none'; };

  const corSelect = document.getElementById('veiculo-cor-select');
  const corOutra = document.getElementById('veiculo-cor-outra');
  corSelect.onchange = ()=>{ corOutra.style.display = corSelect.value==='__outra' ? '' : 'none'; };

  const tipoSelect = document.querySelector('select[name=tipo]');
  const marcaSelect = document.getElementById('veiculo-marca-select');
  const marcaManual = document.getElementById('veiculo-marca-manual');
  const modeloBaseSelect = document.getElementById('veiculo-modelo-base-select');
  const modeloManual = document.getElementById('veiculo-modelo-manual');
  const versaoSelect = document.getElementById('veiculo-versao-select');
  const versaoManual = document.getElementById('veiculo-versao-manual');
  const anoSelect = document.getElementById('veiculo-ano-select');
  const anoManual = document.getElementById('veiculo-ano-manual');
  const modoManualCheckbox = document.getElementById('veiculo-modo-manual');
  const fipePreview = document.getElementById('fipe-valor-preview');

  let modelosAgrupados = new Map(); // nome-base -> [{code,name}, ...] (vem 100% da API)

  function setModoManual(manual){
    usarFipe = !manual;
    marcaSelect.style.display = manual?'none':'';
    marcaManual.style.display = manual?'':'none';
    modeloBaseSelect.style.display = manual?'none':'';
    modeloManual.style.display = manual?'':'none';
    versaoSelect.style.display = manual?'none':'';
    versaoManual.style.display = manual?'':'none';
    anoSelect.style.display = manual?'none':'';
    anoManual.style.display = manual?'':'none';
    if(!manual && marcaSelect.options.length<2) carregarMarcas();
  }
  modoManualCheckbox.onchange = ()=> setModoManual(modoManualCheckbox.checked);

  async function carregarMarcas(){
    marcaSelect.innerHTML = `<option value="">Carregando marcas…</option>`;
    try{
      const brands = await fipeBrands(tipoSelect.value);
      marcaSelect.innerHTML = `<option value="">Selecione a marca…</option>` + brands.map(b=>`<option value="${b.code}">${b.name}</option>`).join('');
      if(fipeState.brandCode){ marcaSelect.value = fipeState.brandCode; if(marcaSelect.value) await carregarModelos(); }
    }catch(err){
      marcaSelect.innerHTML = `<option value="">Não consegui buscar (sem internet ou FIPE fora do ar)</option>`;
    }
  }
  async function carregarModelos(){
    modeloBaseSelect.disabled = true;
    versaoSelect.disabled = true;
    anoSelect.disabled = true;
    versaoSelect.innerHTML = `<option value="">Escolha o modelo primeiro</option>`;
    anoSelect.innerHTML = `<option value="">Escolha a versão primeiro</option>`;
    if(!marcaSelect.value){ modeloBaseSelect.innerHTML = `<option value="">Escolha a marca primeiro</option>`; return; }
    modeloBaseSelect.innerHTML = `<option value="">Carregando modelos…</option>`;
    try{
      const models = await fipeModels(tipoSelect.value, marcaSelect.value);
      modelosAgrupados = fipeAgruparModelos(models);
      const bases = Array.from(modelosAgrupados.keys()).sort((a,b)=>a.localeCompare(b,'pt-BR'));
      modeloBaseSelect.innerHTML = `<option value="">Selecione o modelo…</option>` + bases.map(b=>`<option value="${b}">${b}</option>`).join('');
      modeloBaseSelect.disabled = false;
      // se já tem um modelCode salvo (edição), acha a qual "modelo base" ele pertence
      let baseSelecionada = '';
      if(fipeState.modelCode){
        for(const [base, itens] of modelosAgrupados){
          if(itens.some(it=>it.code===fipeState.modelCode)){ baseSelecionada = base; break; }
        }
      }
      if(baseSelecionada){ modeloBaseSelect.value = baseSelecionada; if(modeloBaseSelect.value) await carregarVersoes(); }
    }catch(err){
      modeloBaseSelect.innerHTML = `<option value="">Não consegui buscar</option>`;
    }
  }
  async function carregarVersoes(){
    versaoSelect.disabled = true;
    anoSelect.disabled = true;
    anoSelect.innerHTML = `<option value="">Escolha a versão primeiro</option>`;
    const itens = modelosAgrupados.get(modeloBaseSelect.value) || [];
    if(!modeloBaseSelect.value || !itens.length){ versaoSelect.innerHTML = `<option value="">Escolha o modelo primeiro</option>`; return; }
    versaoSelect.innerHTML = `<option value="">Selecione a versão…</option>` + itens.map(m=>`<option value="${m.code}">${m.name}</option>`).join('');
    versaoSelect.disabled = false;
    if(fipeState.modelCode){ versaoSelect.value = fipeState.modelCode; if(versaoSelect.value) await carregarAnos(); }
  }
  async function carregarAnos(){
    anoSelect.disabled = true;
    if(!versaoSelect.value){ anoSelect.innerHTML = `<option value="">Escolha a versão primeiro</option>`; return; }
    anoSelect.innerHTML = `<option value="">Carregando anos…</option>`;
    try{
      const years = await fipeYears(tipoSelect.value, marcaSelect.value, versaoSelect.value);
      anoSelect.innerHTML = `<option value="">Selecione o ano…</option>` + years.map(y=>`<option value="${y.code}">${y.name}</option>`).join('');
      anoSelect.disabled = false;
      if(fipeState.yearCode){ anoSelect.value = fipeState.yearCode; if(anoSelect.value) await buscarValorFipe(); }
    }catch(err){
      anoSelect.innerHTML = `<option value="">Não consegui buscar</option>`;
    }
  }
  async function buscarValorFipe(){
    if(!anoSelect.value){ fipePreview.innerHTML=''; return; }
    fipePreview.innerHTML = 'Buscando valor de referência FIPE…';
    try{
      const info = await fipeValue(tipoSelect.value, marcaSelect.value, versaoSelect.value, anoSelect.value);
      fipeState.valorFipe = parseFipePrice(info.price);
      fipeState.valorFipeReferencia = info.referenceMonth;
      fipeState.brandCode = marcaSelect.value; fipeState.modelCode = versaoSelect.value; fipeState.yearCode = anoSelect.value;
      fipePreview.innerHTML = `Valor de referência FIPE: <b class="num">${fmt(fipeState.valorFipe)}</b> <span class="sub">(tabela de ${fipeState.valorFipeReferencia})</span>`;
    }catch(err){
      fipePreview.innerHTML = 'Não consegui buscar o valor FIPE agora — dá pra continuar sem ele e tentar de novo depois.';
    }
  }
  marcaSelect.onchange = ()=>{ fipeState.brandCode = marcaSelect.value; fipeState.modelCode=''; fipeState.yearCode=''; carregarModelos(); };
  modeloBaseSelect.onchange = ()=>{ fipeState.modelCode=''; fipeState.yearCode=''; carregarVersoes(); };
  versaoSelect.onchange = ()=>{ fipeState.modelCode = versaoSelect.value; fipeState.yearCode=''; carregarAnos(); };
  anoSelect.onchange = buscarValorFipe;
  tipoSelect.addEventListener('change', ()=>{ if(usarFipe){ fipeState = {brandCode:'',modelCode:'',yearCode:'',valorFipe:0,valorFipeReferencia:''}; carregarMarcas(); } });

  if(usarFipe) carregarMarcas();

  document.getElementById('veiculo-form').onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('veiculo-error');
    errEl.classList.add('hidden');

    const marca = usarFipe ? (marcaSelect.options[marcaSelect.selectedIndex]?.value ? marcaSelect.options[marcaSelect.selectedIndex].text : '') : marcaManual.value.trim();
    const modelo = usarFipe ? (modeloBaseSelect.options[modeloBaseSelect.selectedIndex]?.value ? modeloBaseSelect.options[modeloBaseSelect.selectedIndex].text : '') : modeloManual.value.trim();
    const versao = usarFipe ? (versaoSelect.options[versaoSelect.selectedIndex]?.value ? versaoSelect.options[versaoSelect.selectedIndex].text : '') : versaoManual.value.trim();
    const anoModelo = usarFipe ? (anoSelect.options[anoSelect.selectedIndex]?.value ? anoSelect.options[anoSelect.selectedIndex].text : '') : anoManual.value.trim();
    const cor = corSelect.value==='__outra' ? corOutra.value.trim() : corSelect.value;

    if(!marca || !modelo){ errEl.textContent = 'Preencha marca e modelo.'; errEl.classList.remove('hidden'); return; }

    const rec = {
      tipo:fd.get('tipo'), categoria:fd.get('categoria'), marca, modelo, versao, anoModelo, cor,
      placa:fd.get('placa'), donoConsignacao:fd.get('donoConsignacao')||'',
      valorCompra: parseMoney(fd.get('valorCompra')||'0'), valorComissao: parseMoney(fd.get('valorComissao')||'0'),
      dataEntrada:fd.get('dataEntrada'), status:fd.get('status'),
      valorVenda: parseMoney(fd.get('valorVenda')||'0'), dataVenda: fd.get('dataVenda')||null,
      obs: fd.get('obs')||'',
      fipeBrandCode: usarFipe? fipeState.brandCode : '', fipeModelCode: usarFipe? fipeState.modelCode : '', fipeYearCode: usarFipe? fipeState.yearCode : '',
      valorFipe: usarFipe? (fipeState.valorFipe||0) : (vehicle.valorFipe||0),
      valorFipeReferencia: usarFipe? (fipeState.valorFipeReferencia||'') : (vehicle.valorFipeReferencia||''),
      // Foto e opcionais não são editados aqui — ficam no botão "Incrementar veículo" da ficha,
      // então só preservamos o que já existia (não editam nada novo por aqui).
      opcionais: vehicle.opcionais || [],
      fotoDataUrl: vehicle.fotoDataUrl || ''
    };
    try{
      if(isEdit){ await updateDoc(doc(db,'vehicles',vehicle.id), rec); }
      else{ await addDoc(collection(db,'vehicles'), rec); }
      closeModal();
    }catch(err){ errEl.textContent = traduzErroFirebase(err); errEl.classList.remove('hidden'); }
  };
}

  const opcionaisHtml = (vehicle.opcionais && vehicle.opcionais.length) ? `<div class="opcionais-tags" style="margin-bottom:14px;">${vehicle.opcionais.map(o=>`<span class="pill">${o}</span>`).join('')}</div>` : '';

    </div>
    <div class="sub" style="margin-bottom:6px;">${vehicle.anoModelo? vehicle.anoModelo+' · ':''}${vehicle.cor||''} · ${vehicle.categoria==='consignacao'?'Consignação · '+(vehicle.donoConsignacao||''):'Próprio'} · entrada em ${vehicle.dataEntrada?new Date(vehicle.dataEntrada+'T00:00').toLocaleDateString('pt-BR'):'—'}</div>
    <div class="field-hint" id="fipe-detalhe-preview" style="margin:0 0 14px;">
      ${vehicle.valorFipe? `Valor de referência FIPE: <b class="num">${fmt(vehicle.valorFipe)}</b> <span class="sub">(tabela de ${vehicle.valorFipeReferencia||'—'})</span>` : '<span class="sub">Sem valor FIPE salvo para este veículo.</span>'}
      ${vehicle.fipeBrandCode && vehicle.fipeModelCode && vehicle.fipeYearCode ? ` <button type="button" class="btn small" id="atualizar-fipe-btn" style="margin-left:8px;">Atualizar valor FIPE</button>` : ''}
    </div>
    ${opcionaisHtml}

    ${despRows}
    <div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap;">
      <button type="button" class="btn small" id="add-despesa">+ Nova despesa</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="button" class="btn ghost" id="cancel-modal">Fechar</button>
        <button type="button" class="btn ghost" id="incrementar-veiculo-btn" style="display:flex;align-items:center;gap:6px;">${plusIcon} Incrementar veículo</button>
        <button type="button" class="btn primary" id="edit-veiculo-btn">Editar veículo</button>
      </div>
    </div>
  `);
  document.getElementById('cancel-modal').onclick = closeModal;
  document.getElementById('edit-veiculo-btn').onclick = ()=> veiculoModal(vehicle);
  document.getElementById('incrementar-veiculo-btn').onclick = ()=> veiculoIncrementoModal(vehicle);
  document.getElementById('add-despesa').onclick = ()=> despesaModal(vehicle.id, ()=>{ const v=vehicleById(vehicle.id); if(v) veiculoDetalheModal(v); });
  const atualizarBtn = document.getElementById('atualizar-fipe-btn');
  if(atualizarBtn){
    atualizarBtn.onclick = async ()=>{
      const preview = document.getElementById('fipe-detalhe-preview');
      atualizarBtn.disabled = true;
      preview.innerHTML = 'Buscando valor atualizado na FIPE…';
      try{
        const info = await fipeValue(vehicle.tipo, vehicle.fipeBrandCode, vehicle.fipeModelCode, vehicle.fipeYearCode);
        const valorFipe = parseFipePrice(info.price);
        const valorFipeReferencia = info.referenceMonth;
        await updateDoc(doc(db,'vehicles',vehicle.id), { valorFipe, valorFipeReferencia });
        veiculoDetalheModal(vehicleById(vehicle.id) || {...vehicle, valorFipe, valorFipeReferencia});
      }catch(err){
        preview.innerHTML = 'Não consegui atualizar agora — tente de novo mais tarde.';
      }
    };
  }
  document.querySelectorAll('.del-despesa').forEach(b=> b.onclick = async ()=>{
    if(!requireAdmin()) return;
    if(!confirm('Excluir esta despesa?')) return;
    try{ await deleteDoc(doc(db,'expenses',b.dataset.id)); veiculoDetalheModal(vehicleById(vehicle.id)); }
    catch(err){ alert(traduzErroFirebase(err)); }
  });
}

// Adiciona foto de capa e opcionais a um veículo já cadastrado (separado do cadastro/edição principal, a pedido do Maycon)

  let pendingFoto = vehicle.fotoDataUrl || '';

  openModal(`

        <div>
          <input type="file" accept="image/*" id="incremento-foto-input">

      <button type="button" class="btn primary" id="salvar-incremento-btn">Salvar</button>
    </div>
    <div class="error-msg hidden" id="incremento-error"></div>
  `);

  const fotoPreview = document.getElementById('incremento-foto-preview');
  fotoInput.onchange = async ()=>{

  document.getElementById('salvar-incremento-btn').onclick = async ()=>{

    try{
      await updateDoc(doc(db,'vehicles',vehicle.id), { fotoDataUrl: pendingFoto||'', opcionais: marcados });
      closeModal();
      const v = vehicleById(vehicle.id); if(v) veiculoDetalheModal(v);
    }catch(err){
      const errEl = document.getElementById('incremento-error');
      errEl.textContent = traduzErroFirebase(err); errEl.classList.remove('hidden');
    }
  };
}

/* ============================================================
   CAIXA DIÁRIO (todos os gastos — vinculados a veículo ou gerais)
============================================================ */
function renderDespesas(){
  const veiculosOrdenados = DATA.vehicles.slice().sort((a,b)=>(b.dataEntrada||'').localeCompare(a.dataEntrada||''));
  let list = DATA.expenses.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(despesasFiltroVeiculo==='geral') list = list.filter(e=>!e.vehicleId);
  else if(despesasFiltroVeiculo!=='todos') list = list.filter(e=>e.vehicleId===despesasFiltroVeiculo);

  const total = list.reduce((s,e)=>s+e.valor,0);

  const rows = list.map(e=>{
    const v = e.vehicleId ? vehicleById(e.vehicleId) : null;
    return `<tr>
      <td data-label="Data">${e.data? new Date(e.data+'T00:00').toLocaleDateString('pt-BR'):'—'}</td>
      <td data-label="Descrição">${e.descricao}</td>
      <td data-label="Veículo">${v? `${v.marca||''} ${v.modelo||''}` : '<span class="sub">Geral (empresa)</span>'}</td>
      <td data-label="Divisão">${e.divisao==='individual'? 'Individual · '+(userById(e.socioId)?.name||'?') : 'Dividir entre sócios'}</td>
      <td data-label="Valor" class="num">${fmt(e.valor)}</td>
      <td>${isAdmin()? `<button class="icon-btn del-despesa-geral" data-id="${e.id}" title="Excluir">${trashIcon}</button>` : ''}</td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div><h1>Caixa diário</h1><p>Gastos do dia a dia — vinculados a um veículo (soma no custo dele) ou gerais da empresa</p></div>
    <button class="btn primary" id="new-despesa-geral">+ Novo gasto</button>
  </div>
  <div class="field" style="max-width:340px;margin-bottom:14px;">
    <label>Filtrar por veículo</label>
    <select id="despesas-filtro-veiculo">
      <option value="todos" ${despesasFiltroVeiculo==='todos'?'selected':''}>Todos os gastos</option>
      <option value="geral" ${despesasFiltroVeiculo==='geral'?'selected':''}>Só gerais (sem veículo)</option>
      ${veiculosOrdenados.map(v=>`<option value="${v.id}" ${despesasFiltroVeiculo===v.id?'selected':''}>${v.marca||''} ${v.modelo||''}${v.status==='vendido'?' (vendido)':''}</option>`).join('')}
    </select>
  </div>
  <div class="table-wrap">
    ${list.length ? `<table class="resp-table"><thead><tr><th>Data</th><th>Descrição</th><th>Veículo</th><th>Divisão</th><th>Valor</th><th></th></tr></thead><tbody>${rows}</tbody></table>`

  <div class="field-hint" style="margin-top:14px;">Total ${despesasFiltroVeiculo==='todos'?'de todos os gastos':'no filtro atual'}: <b class="num">${fmt(total)}</b>. Gastos vinculados a um veículo entram no custo dele — quando ele for vendido, o lucro já sai descontando esses gastos.</div>
  `;
}

        ${isAdmin() && u.id!==currentUser.id ? `<button class="icon-btn del-socio" data-id="${u.id}" title="Excluir">${trashIcon}</button>` : ''}
      </div>
    </div>`).join('');
  return `
  <div class="page-head">
    <div><h1>Usuários</h1><p>Quem tem acesso ao sistema</p></div>
    ${isAdmin()? `<button class="btn primary" id="new-socio">+ Novo usuário</button>` : ''}
  </div>
  ${rows || `<div class="empty-state">Nenhum usuário cadastrado.</div>`}
  `;
}

function socioModal(user){
  if(!requireAdmin()) return;
  const isEdit = !!user;
  openModal(`
    <h2>${isEdit? 'Editar usuário' : 'Novo usuário'}</h2>
    <form id="socio-form">
      <div class="field"><label>Nome</label><input name="name" required placeholder="Ex: Iago Moreira" value="${isEdit? user.name : ''}"></div>
      ${isEdit ? `
      <div class="field"><label>E-mail interno (login)</label><input value="${user.email}" disabled></div>
      ` : `
      <div class="field"><label>Nome de usuário (vira e-mail interno)</label><input name="username" required placeholder="ex: iago"></div>
      <div class="field"><label>Senha inicial</label><input name="password" type="password" required minlength="6" placeholder="mínimo 6 caracteres"></div>
      `}
      <div class="field"><label>Papel</label><select name="role">
        <option value="socioadmin" ${isEdit && user.role==='socioadmin'?'selected':''}>Sócio-admin (dono, acesso total, entra na divisão de lucro)</option>
        <option value="admin" ${isEdit && user.role==='admin'?'selected':''}>Administrador (acesso total ao sistema, mas NÃO entra na divisão de lucro)</option>
        <option value="socio" ${isEdit && user.role==='socio'?'selected':''}>Sócio (entra na divisão de lucro, sem acesso de administrador)</option>
        <option value="gerente" ${isEdit && user.role==='gerente'?'selected':''}>Gerente (uso normal do sistema)</option>
        <option value="vendedor" ${isEdit && user.role==='vendedor'?'selected':''}>Vendedor(a) (uso normal do sistema)</option>
      </select></div>
      <div class="field"><label>Cor</label>
        <div class="color-swatches">${PALETTE.map(p=>`<span class="swatch ${isEdit && p===user.color?'sel':''}" style="background:${p}" data-color="${p}"></span>`).join('')}</div>
        <input type="hidden" name="color" value="${isEdit? user.color : PALETTE[DATA.users.length % PALETTE.length]}">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancel-modal">Cancelar</button>
        <button type="submit" class="btn primary">${isEdit? 'Salvar' : 'Cadastrar'}</button>
      </div>
      <div class="error-msg hidden" id="socio-error"></div>
    </form>`);
  document.getElementById('cancel-modal').onclick = closeModal;
  document.querySelectorAll('.swatch').forEach(sw=> sw.onclick=()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
    sw.classList.add('sel'); document.querySelector('input[name=color]').value = sw.dataset.color;
  });
  document.getElementById('socio-form').onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('socio-error');
    try{
      if(isEdit){
        await updateDoc(doc(db,'users',user.id), { name:fd.get('name'), role:fd.get('role'), color:fd.get('color') });
      }else{
        const email = fd.get('username').trim().toLowerCase().replace(/[^a-z0-9.]/g,'') + '@moreiramotors.local';
        const cred = await createUserWithEmailAndPassword(secondaryAuth, email, fd.get('password'));
        await setDoc(doc(db,'users',cred.user.uid), { name:fd.get('name'), email, role:fd.get('role'), color:fd.get('color') });
        await signOut(secondaryAuth);
      }
      closeModal();
    }catch(err){ errEl.textContent = traduzErroFirebase(err); errEl.classList.remove('hidden'); }
  };
}

============================================================ */
function resizeImageFile(file, maxSize){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else{ if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=>reject(new Error('imagem inválida'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

function perfilModal(user){
  let pendingPhoto = user.photoDataUrl || '';
  openModal(`
    <h2>Meu perfil</h2>
    <div class="avatar-upload-preview" id="perfil-avatar-preview" style="background:${user.color}">${avatarContent(user)}</div>
    <form id="perfil-form">
      <div class="field"><label>Nome</label><input name="name" required value="${user.name}"></div>
      <div class="field"><label>Cor</label>
        <div class="color-swatches">${PALETTE.map(p=>`<span class="swatch ${p===user.color?'sel':''}" style="background:${p}" data-color="${p}"></span>`).join('')}</div>
        <input type="hidden" name="color" value="${user.color}">
      </div>
      <div class="field"><label>Foto de perfil (opcional)</label>
        <input type="file" accept="image/*" id="perfil-foto-input">
        ${user.photoDataUrl? `<button type="button" class="btn ghost small" id="remover-foto" style="margin-top:8px;">Remover foto atual</button>` : ''}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancel-modal">Cancelar</button>
        <button type="submit" class="btn primary">Salvar perfil</button>
      </div>
      <div class="error-msg hidden" id="perfil-error"></div>
    </form>

    <div style="border-top:1px solid var(--line);margin:22px 0 16px;"></div>
    <h2 style="font-size:16px;">Trocar senha</h2>
    <form id="senha-form">
      <div class="field"><label>Senha atual</label><input name="senhaAtual" type="password" required autocomplete="current-password"></div>
      <div class="field-row">
        <div class="field"><label>Nova senha</label><input name="novaSenha" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field"><label>Confirmar nova senha</label><input name="confirmaSenha" type="password" required minlength="6" autocomplete="new-password"></div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn primary">Atualizar senha</button>
      </div>
      <div class="error-msg hidden" id="senha-error"></div>
      <div class="field-hint hidden" id="senha-sucesso" style="color:var(--green);">Senha atualizada com sucesso.</div>
    </form>
  `);
  document.getElementById('cancel-modal').onclick = closeModal;
  document.querySelectorAll('#perfil-form .swatch').forEach(sw=> sw.onclick=()=>{
    document.querySelectorAll('#perfil-form .swatch').forEach(s=>s.classList.remove('sel'));
    sw.classList.add('sel');
    document.querySelector('#perfil-form input[name=color]').value = sw.dataset.color;
    if(!pendingPhoto) document.getElementById('perfil-avatar-preview').style.background = sw.dataset.color;
  });
  const fotoInput = document.getElementById('perfil-foto-input');
  fotoInput.onchange = async ()=>{
    const file = fotoInput.files[0]; if(!file) return;
    try{
      pendingPhoto = await resizeImageFile(file, 200);
      document.getElementById('perfil-avatar-preview').innerHTML = `<img src="${pendingPhoto}" alt="">`;
    }catch(err){ alert('Não consegui usar essa imagem. Tenta outra foto.'); }
  };
  const removerFoto = document.getElementById('remover-foto');
  if(removerFoto) removerFoto.onclick = ()=>{
    pendingPhoto = '';
    document.getElementById('perfil-avatar-preview').innerHTML = initialOf(user.name);
  };
  document.getElementById('perfil-form').onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('perfil-error');
    try{
      await updateDoc(doc(db,'users',user.id), { name:fd.get('name'), color:fd.get('color'), photoDataUrl: pendingPhoto });
      closeModal();
    }catch(err){ errEl.textContent = traduzErroFirebase(err); errEl.classList.remove('hidden'); }
  };
  document.getElementById('senha-form').onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('senha-error');
    const okEl = document.getElementById('senha-sucesso');
    errEl.classList.add('hidden'); okEl.classList.add('hidden');
    const novaSenha = fd.get('novaSenha'), confirmaSenha = fd.get('confirmaSenha');
    if(novaSenha !== confirmaSenha){ errEl.textContent = 'As duas senhas novas não são iguais.'; errEl.classList.remove('hidden'); return; }
    try{
      const cred = EmailAuthProvider.credential(user.email, fd.get('senhaAtual'));
      await reauthenticateWithCredential(auth.currentUser, cred);
      await updatePassword(auth.currentUser, novaSenha);
      okEl.classList.remove('hidden');
      e.target.reset();
    }catch(err){ errEl.textContent = traduzErroFirebase(err); errEl.classList.remove('hidden'); }
  };
}

============================================================ */
function renderBackup(){
  return `
  <div class="page-head"><div><h1>Backup</h1><p>Exportar ou importar todos os dados do sistema</p></div></div>
  <div class="card">
    <h3>Exportar</h3>
    <p class="sub">Baixa um arquivo .json com tudo: veículos, despesas, aportes e sócios.</p>
    <button class="btn primary" id="export-backup" style="margin-top:10px;">Baixar backup</button>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3>Importar</h3>
    <p class="sub">Restaura dados a partir de um arquivo .json exportado daqui. Isso adiciona/atualiza registros pelos IDs presentes no arquivo.</p>
    <input type="file" id="import-file" accept="application/json" style="margin-top:10px;">
  </div>
  <div class="field-hint" style="margin-top:16px;">Versão do sistema: ${APP_VERSION}</div>
  `;
}
async function restoreCollection(name, list){
  const batch = writeBatch(db);
  list.forEach(item=>{ const {id, ...rest} = item; batch.set(doc(db,name, id || undefined), rest); });
  await batch.commit();
}

/* ============================================================
   HANDLERS GLOBAIS
============================================================ */
function attachHandlers(){
  document.querySelectorAll('.nav-item:not(.nav-group-toggle)').forEach(b=> b.onclick = ()=>{ currentTab = b.dataset.tab; mobileDrawerOpen=false; render(); });
  document.querySelectorAll('.nav-group-toggle').forEach(b=> b.onclick = ()=>{ configMenuOpen = !configMenuOpen; render(); });
  const hamb = document.getElementById('hamburger-btn'); if(hamb) hamb.onclick = ()=>{ mobileDrawerOpen=true; render(); };
  const backdrop = document.getElementById('drawer-backdrop'); if(backdrop) backdrop.onclick = ()=>{ mobileDrawerOpen=false; render(); };
  const logoutBtn = document.getElementById('logout-btn'); if(logoutBtn) logoutBtn.onclick = (e)=>{ e.stopPropagation(); doLogout(); };
  const drawerLogout = document.querySelector('.drawer-logout-btn'); if(drawerLogout) drawerLogout.onclick = doLogout;
  const mobileProfile = document.getElementById('mobile-profile-btn'); if(mobileProfile) mobileProfile.onclick = ()=> perfilModal(currentUser);
  const sidebarProfile = document.getElementById('profile-btn'); if(sidebarProfile) sidebarProfile.onclick = ()=> perfilModal(currentUser);
  const drawerProfile = document.getElementById('mobile-drawer-profile-btn'); if(drawerProfile) drawerProfile.onclick = ()=>{ mobileDrawerOpen=false; perfilModal(currentUser); };

  // Estoque
  document.querySelectorAll('.chip[data-filtro]').forEach(c=> c.onclick = ()=>{ estoqueFiltro = c.dataset.filtro; render(); });
  const newV = document.getElementById('new-veiculo'); if(newV) newV.onclick = ()=> veiculoModal(null);
  document.querySelectorAll('.ver-veiculo').forEach(b=> b.onclick = ()=> veiculoDetalheModal(vehicleById(b.dataset.id)));
  document.querySelectorAll('.incrementar-veiculo').forEach(b=> b.onclick = ()=> veiculoIncrementoModal(vehicleById(b.dataset.id)));
  document.querySelectorAll('.veiculo-card-mini').forEach(b=> b.onclick = ()=> veiculoDetalheModal(vehicleById(b.dataset.id)));
  document.querySelectorAll('.del-veiculo').forEach(b=> b.onclick = async ()=>{
    if(!requireAdmin()) return; if(!confirm('Excluir este veículo e suas despesas associadas?')) return;
    try{
      await deleteDoc(doc(db,'vehicles',b.dataset.id));
      const dels = expensesOf(b.dataset.id).map(e=>deleteDoc(doc(db,'expenses',e.id)));
      await Promise.all(dels);
    }catch(err){ alert(traduzErroFirebase(err)); }
  });

  // Caixa
  const newAporte = document.getElementById('new-aporte'); if(newAporte) newAporte.onclick = aporteModal;
  document.querySelectorAll('.del-aporte').forEach(b=> b.onclick = async ()=>{
    if(!requireAdmin()) return; if(!confirm('Excluir este lançamento?')) return;
    try{ await deleteDoc(doc(db,'capitalEntries',b.dataset.id)); }catch(err){ alert(traduzErroFirebase(err)); }
  });

  // Caixa diário (gastos)
  const newDespesaGeral = document.getElementById('new-despesa-geral'); if(newDespesaGeral) newDespesaGeral.onclick = ()=> despesaModal(null);
  const filtroDespesas = document.getElementById('despesas-filtro-veiculo'); if(filtroDespesas) filtroDespesas.onchange = ()=>{ despesasFiltroVeiculo = filtroDespesas.value; render(); };
  document.querySelectorAll('.del-despesa-geral').forEach(b=> b.onclick = async ()=>{
    if(!requireAdmin()) return; if(!confirm('Excluir este gasto?')) return;
    try{ await deleteDoc(doc(db,'expenses',b.dataset.id)); }catch(err){ alert(traduzErroFirebase(err)); }
  });

  // Sócios
  const newSocio = document.getElementById('new-socio'); if(newSocio) newSocio.onclick = ()=> socioModal();
  document.querySelectorAll('.edit-socio').forEach(b=> b.onclick = ()=>{
    const u = userById(b.dataset.id); if(u) socioModal(u);
  });
  document.querySelectorAll('.del-socio').forEach(b=> b.onclick = async ()=>{
    if(!requireAdmin()) return; if(!confirm('Remover o acesso deste usuário ao sistema? (isso não apaga histórico de veículos/despesas)')) return;
    try{ await deleteDoc(doc(db,'users',b.dataset.id)); }catch(err){ alert(traduzErroFirebase(err)); }
  });

  // Backup
  const exportBtn = document.getElementById('export-backup');
  if(exportBtn) exportBtn.onclick = ()=>{
    const payload = { exportedAt: new Date().toISOString(), version: APP_VERSION, users:DATA.users, vehicles:DATA.vehicles, expenses:DATA.expenses, capitalEntries:DATA.capitalEntries };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-moreira-motors-${todayStr()}.json`; a.click();
  };
  const importFile = document.getElementById('import-file');
  if(importFile) importFile.onchange = async ()=>{
    if(!requireAdmin()){ importFile.value=''; return; }
    const file = importFile.files[0]; if(!file) return;
    try{
      const parsed = JSON.parse(await file.text());
      if(!confirm('Isso vai sobrescrever/criar registros com base no arquivo. Confirmar?')) { importFile.value=''; return; }
      await restoreCollection('users', parsed.users||[]);
      await restoreCollection('vehicles', parsed.vehicles||[]);
      await restoreCollection('expenses', parsed.expenses||[]);
      await restoreCollection('capitalEntries', parsed.capitalEntries||[]);
      alert('Backup restaurado.');
    }catch(err){ alert('Arquivo inválido ou erro ao importar: ' + err.message); }
    importFile.value='';
  };
}
